# Quality gates: hard compile, sanitizers, leak detection (Linux LSan), lint, scan-build.
# Valgrind is intentionally not used (poor Apple Silicon story; sanitizers replace it).
#
# Green test list grows via tests/gate-suites (single source of truth). Do not
# hard-code a stale --only filter here — use scripts/ci-linux.sh / step_gate.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail fast on sanitizer issues. LSan is meaningful on Linux.
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:allocator_may_return_null=1

jobs:
  # Docs-only PRs skip the build jobs. They must stay jobs gated by `if:`, not
  # workflow `paths-ignore`: linux and macos are required checks, and a skipped
  # job passes them while a workflow that never runs blocks the merge.
  # What counts as docs lives in scripts/touches-code.sh.
  changes:
    name: changes (code vs docs-only)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merge commit; HEAD^1 is the base tip.
          if git diff --name-only HEAD^1 HEAD | ./scripts/touches-code.sh; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: linux (ASan+UBSan+LSan, lint, scan-build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # Checkout is a GitHub-maintained JS action (runs on Node in the runner).
      # Our project is pure C — we do not use Node ourselves.
      - uses: actions/checkout@v5

      - name: Linux CI (same as ./scripts/ci-linux.sh)
        run: |
          chmod +x scripts/ci-linux.sh scripts/read-gate-suites.sh scripts/check-coverage.sh
          ./scripts/ci-linux.sh --inner --install

  # Plugin protocol spec (plan 24): every schema and example in
  # specs/PLUGIN-PROTOCOL.md must validate, its plugin scripts must compile, and
  # schema/plugin/v1/ and tests/fixtures/plugin/ must hold the same bytes as
  # their spec blocks. Python is a docs tool here only. This job depends only on
  # the repo, so it can be a required check.
  docs:
    name: docs (plugin protocol spec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned validator packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps -r scripts/plugin-spec-requirements.txt

      - name: Validate the plugin protocol spec
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/validate_plugin_spec.py specs/PLUGIN-PROTOCOL.md'

  # GitHub Pages publishes main, so each schema $id must serve the bytes of that
  # file on main. The docs job covers this checkout's files. Pages redeploys after
  # a push to main, so a failed comparison is retried every 20 s, 16 times (about
  # 5 minutes) before the job fails. A separate job, so a github.io outage never
  # blocks the docs check.
  docs-pages:
    name: docs (schema $id on GitHub Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Fetch each schema $id
        shell: bash
        run: |
          shopt -s nullglob
          files=(schema/plugin/v1/*.json)
          [ ${#files[@]} -gt 0 ] || { echo "FAIL no schema files on main"; exit 1; }
          check() {
            local f url fail=0
            for f in "${files[@]}"; do
              if ! url=$(jq -er '."$id"' "$f"); then
                echo "FAIL $f on main: no \$id"; fail=1
              elif ! curl -fsSL --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/got.json" "$url"; then
                echo "FAIL $url: fetch failed"; fail=1
              elif ! cmp -s "$f" "$RUNNER_TEMP/got.json"; then
                echo "FAIL $url: differs from $f on main"; fail=1
              else
                echo "ok   $url"
              fi
            done
            return $fail
          }
          for attempt in $(seq 16); do
            if check; then exit 0; fi
            if [ "$attempt" -lt 16 ]; then
              echo "Attempt $attempt of 16 failed. Pages may still be deploying main. Retrying in 20 s."
              sleep 20
            fi
          done
          exit 1

  # Line coverage of src/*.c: 100% functions + 100% effective lines, plus every
  # branch side in the pure TUs (plan 18b; see scripts/check-coverage.sh). Add
  # this job name to branch protection required checks when ready.
  linux-coverage:
    name: linux (line coverage on src/)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang llvm sqlite3

      - name: Production line coverage (src/*.c target 100%)
        run: |
          chmod +x scripts/check-coverage.sh scripts/read-gate-suites.sh
          ./scripts/check-coverage.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-cov/coverage-report.txt
          if-no-files-found: ignore

  macos:
    name: macos (ASan+UBSan, lint, leaks)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    env:
      # GitHub's macOS image may ship third-party taps (e.g. aws/tap) that Brew
      # now refuses without explicit trust. We only use core/llvm formulae.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1:allocator_may_return_null=1
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          # Drop untrusted preinstalled taps so brew install is not noisy/blocked.
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja cppcheck sqlite
          # sqlite is keg-only, so /usr/bin/sqlite3 would stay first. Schema tests
          # shell out to sqlite3, including entries_fts. Apple's CLI cannot create
          # or read FTS5 tables written by the vendored amalgamation (PR #22).
          echo "$(brew --prefix sqlite)/bin" >> "$GITHUB_PATH"
          # LLVM provides clang-tidy, clang-format, scan-build. Pin the major
          # version: the unpinned `llvm` floats, and each release auto-enables new
          # checks under our `bugprone-*`/`readability-*` wildcards, turning a
          # toolchain bump into red CI on untouched code. Linux pins clang in its
          # image for the same reason; bumping this pin is a deliberate change
          # (fix any new findings, then raise the number).
          brew install llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DREMEMBER_ENABLE_SANITIZERS=ON \
            -DREMEMBER_ENABLE_LSAN=OFF \
            -DREMEMBER_TEST_VFS=ON

      - name: Build
        run: cmake --build build

      - name: CTest (step_gate + store_asan_gate)
        run: ctest --test-dir build --output-on-failure

      - name: Black-box gate (tests/gate-suites)
        run: |
          GATE=$(./scripts/read-gate-suites.sh)
          ./build/remember_tests ./build/remember --only "$GATE"
          ./build/remember_store_tests

      - name: Lint
        env:
          CI: "true"
          BUILD_DIR: build
          REMEMBER_SCAN_BUILD: "1"
          REMEMBER_IWYU: "0"
        run: ./scripts/lint-all.sh

      - name: macOS leaks(1) CLI smoke (non-ASan binary)
        run: cmake --build build --target leaks-macos
